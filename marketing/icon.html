<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  body { background: radial-gradient(circle at 50% 70%, #ff8fc8 0%, #6d42a8 55%, #1d1545 100%); position: relative; font-family: "Segoe UI Black", sans-serif; }
  .ring { position: absolute; inset: 18px; border-radius: 50%; border: 10px solid #ff78c8;
    box-shadow: 0 0 30px 6px rgba(255, 120, 200, .8), inset 0 0 30px rgba(255, 120, 200, .6); }
  .half { position: absolute; left: 96px; top: 14px; width: 320px; height: 480px; overflow: hidden; }
  .half svg { width: 320px; height: 480px; }
  .left { clip-path: inset(0 50% 0 0); }
  .right { clip-path: inset(0 0 0 50%); }
  .seam { position: absolute; left: 255px; top: 40px; width: 3px; height: 300px;
    background: repeating-linear-gradient(#3a2a40 0 12px, transparent 12px 20px); }
  .label { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; color: #fff; font-size: 40px; letter-spacing: 2px;
    text-shadow: 0 0 10px #ff78c8, 0 0 24px #ff78c8, 3px 4px 0 #4a2a80; }
</style>
</head>
<body>
  <div class="ring"></div>
  <div class="half left" id="cute"></div>
  <div class="half right" id="wrong"></div>
  <div class="seam"></div>
  <div class="label">PLUSHIE MART</div>
  <script src="bunny.js"></script>
  <script>
    document.getElementById("cute").innerHTML = bunny({});
    document.getElementById("wrong").innerHTML = bunny({ body: "#b8b2be", inner: "#9c96a4", belly: "#d6d2da", wrong: true });
  </script>
</body>
</html>
